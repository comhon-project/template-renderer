name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.1, 8.2, 8.3, 8.4, 8.5]
        laravel: [10.*, 11.*, 12.*]
        stability: [prefer-stable]
        include:
          - laravel: 10.*
            testbench: 8.*
          - laravel: 11.*
            testbench: 9.*
          - laravel: 12.*
            testbench: 10.*
        exclude:
          - laravel: 12.*
            php: 8.1
          - laravel: 11.*
            php: 8.1
          # PHP 8.5 is only supported by Laravel 12
          - laravel: 11.*
            php: 8.5
          - laravel: 10.*
            php: 8.5

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Allow end-of-life Laravel versions
        # Laravel 10 and 11 are end-of-life: every release carries unpatched security advisories,
        # so Composer >= 2.9 refuses to resolve them by default. We test against them on purpose,
        # so exempt laravel/framework only, and only on these matrix rows. Every other dependency
        # still blocks the install when a known vulnerability has no patched release.
        # This only affects the CI install, never package consumers.
        if: startsWith(matrix.laravel, '10.') || startsWith(matrix.laravel, '11.')
        shell: bash
        run: |
          composer config policy.advisories.ignore --json '{"laravel/framework": "End-of-life release line, tested on purpose"}'

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: composer test
